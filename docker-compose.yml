name: socialhub

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317

services:
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - auth-service
      - community-service
      - feed-service
      - message-service
      - moderation-service
      - notification-service
      - post-service
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - socialhub-network

  gateway-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://gateway/nginx_status
    depends_on:
      - gateway
    ports:
      - "9113:9113"
    networks:
      - socialhub-network

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - auth-service
      - community-service
      - feed-service
      - message-service
      - moderation-service
      - notification-service
      - post-service
      - frontend
      - gateway-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./tools/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./tools/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - socialhub-network

  grafana:
    image: grafana/grafana:11.5.2
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/socialhub-overview.json
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./tools/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - socialhub-network

  loki:
    image: grafana/loki:2.9.8
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./tools/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - socialhub-network

  promtail:
    image: grafana/promtail:2.9.8
    command:
      - -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ./tools/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    networks:
      - socialhub-network

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./tools/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - socialhub-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: frontend
    ports:
      - "3000:8080"
    networks:
      - socialhub-network

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-socialhub_auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-local_auth_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_POSTGRES_USER:-socialhub} -d ${AUTH_POSTGRES_DB:-socialhub_auth}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - socialhub-network

  community-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${COMMUNITY_POSTGRES_DB:-socialhub_community}
      POSTGRES_USER: ${COMMUNITY_POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${COMMUNITY_POSTGRES_PASSWORD:-local_community_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMUNITY_POSTGRES_USER:-socialhub} -d ${COMMUNITY_POSTGRES_DB:-socialhub_community}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - community_postgres_data:/var/lib/postgresql/data
    networks:
      - socialhub-network

  moderation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MODERATION_POSTGRES_DB:-socialhub_moderation}
      POSTGRES_USER: ${MODERATION_POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${MODERATION_POSTGRES_PASSWORD:-local_moderation_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MODERATION_POSTGRES_USER:-socialhub} -d ${MODERATION_POSTGRES_DB:-socialhub_moderation}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5434:5432"
    volumes:
      - moderation_postgres_data:/var/lib/postgresql/data
    networks:
      - socialhub-network

  post-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POST_POSTGRES_DB:-socialhub_posts}
      POSTGRES_USER: ${POST_POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${POST_POSTGRES_PASSWORD:-local_post_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POST_POSTGRES_USER:-socialhub} -d ${POST_POSTGRES_DB:-socialhub_posts}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5435:5432"
    volumes:
      - post_postgres_data:/var/lib/postgresql/data
    networks:
      - socialhub-network

  post-object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${POST_MINIO_ROOT_USER:-local_minio_user}
      MINIO_ROOT_PASSWORD: ${POST_MINIO_ROOT_PASSWORD:-local_minio_password}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POST_MINIO_PORT:-9000}:9000"
      - "${POST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - post_minio_data:/data
    networks:
      - socialhub-network

  message-db:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "27018:27017"
    volumes:
      - message_mongo_data:/data/db
    networks:
      - socialhub-network

  notification-db:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "27019:27017"
    volumes:
      - notification_mongo_data:/data/db
    networks:
      - socialhub-network

  feed-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    networks:
      - socialhub-network

  auth-service:
    build:
      context: ./AuthService
      dockerfile: src/SocialHub.Auth.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: auth-service
      POSTGRES_HOST: auth-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-socialhub_auth}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-socialhub}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-local_auth_password}
      JWT_ISSUER: ${JWT_ISSUER:-SocialHub.AuthService}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-SocialHub.Client}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      BOOTSTRAP_MODERATORS: ${BOOTSTRAP_MODERATORS:-}
      ExternalServices__NotificationBaseUrl: http://notification-service:8080
      ExternalServices__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "5000:8080"
    networks:
      - socialhub-network

  community-service:
    build:
      context: ./CommunityService
      dockerfile: src/SocialHub.Community.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: community-service
      ASPNETCORE_URLS: http://+:8080
      ApplyMigrationsOnStartup: "true"
      ConnectionStrings__CommunityDatabase: Host=community-db;Port=5432;Database=${COMMUNITY_POSTGRES_DB:-socialhub_community};Username=${COMMUNITY_POSTGRES_USER:-socialhub};Password=${COMMUNITY_POSTGRES_PASSWORD:-local_community_password}
      ExternalServices__NotificationBaseUrl: http://notification-service:8080
      ExternalServices__PostBaseUrl: http://post-service:8080
      ExternalServices__ModerationBaseUrl: http://moderation-service:8080
      ExternalServices__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      ExternalServices__TimeoutSeconds: ${EXTERNAL_SERVICE_TIMEOUT_SECONDS:-4}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
    depends_on:
      community-db:
        condition: service_healthy
    ports:
      - "5001:8080"
    networks:
      - socialhub-network

  message-service:
    build:
      context: ./MessageService
      dockerfile: src/SocialHub.Message.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: message-service
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://message-db:27017
      Mongo__DatabaseName: socialhub_messages
      Mongo__DialogsCollection: dialogs
      NotificationService__BaseUrl: http://notification-service:8080
      NotificationService__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
    depends_on:
      message-db:
        condition: service_healthy
    ports:
      - "5002:8080"
    networks:
      - socialhub-network

  moderation-service:
    build:
      context: ./ModerationService
      dockerfile: src/SocialHub.Moderation.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: moderation-service
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ModerationDatabase: Host=moderation-db;Port=5432;Database=${MODERATION_POSTGRES_DB:-socialhub_moderation};Username=${MODERATION_POSTGRES_USER:-socialhub};Password=${MODERATION_POSTGRES_PASSWORD:-local_moderation_password}
      ExternalServices__PostBaseUrl: http://post-service:8080
      ExternalServices__AuthBaseUrl: http://auth-service:8080
      ExternalServices__CommunityBaseUrl: http://community-service:8080
      ExternalServices__NotificationBaseUrl: http://notification-service:8080
      ExternalServices__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
    depends_on:
      moderation-db:
        condition: service_healthy
    ports:
      - "5003:8080"
    networks:
      - socialhub-network

  notification-service:
    build:
      context: ./NotificationService
      dockerfile: src/SocialHub.Notification.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification-service
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://notification-db:27017
      Mongo__DatabaseName: socialhub_notifications
      Mongo__NotificationsCollection: notifications
      Mongo__EventsCollection: notification_events
      ExternalServices__AuthBaseUrl: http://auth-service:8080
      NotificationProcessing__PollingIntervalSeconds: 2
      NotificationProcessing__MaxAttempts: 5
      NotificationRetention__NotificationDays: ${NOTIFICATION_RETENTION_DAYS:-90}
      NotificationRetention__ReadNotificationDays: ${NOTIFICATION_READ_RETENTION_DAYS:-30}
      NotificationRetention__CompletedEventDays: ${NOTIFICATION_COMPLETED_EVENT_RETENTION_DAYS:-14}
      NotificationRetention__FailedEventDays: ${NOTIFICATION_FAILED_EVENT_RETENTION_DAYS:-30}
      Smtp__Enabled: ${SMTP_ENABLED:-false}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__UseStartTls: ${SMTP_USE_START_TLS:-true}
      Smtp__UserName: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-SocialHub}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
    depends_on:
      notification-db:
        condition: service_healthy
    ports:
      - "5004:8080"
    networks:
      - socialhub-network

  feed-service:
    build:
      context: ./FeedService
      dockerfile: src/SocialHub.Feed.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: feed-service
      ASPNETCORE_URLS: http://+:8080
      Cache__ConnectionString: feed-cache:6379
      Cache__KeyPrefix: feed
      Cache__TtlSeconds: 300
      Services__CommunityServiceUrl: http://community-service:8080
      Services__PostServiceUrl: http://post-service:8080
      Services__TimeoutSeconds: 4
      Services__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
    depends_on:
      feed-cache:
        condition: service_healthy
    ports:
      - "5005:8080"
    networks:
      - socialhub-network

  post-service:
    build:
      context: ./PostService
      dockerfile: src/SocialHub.Post.Api/Dockerfile
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: post-service
      ASPNETCORE_URLS: http://+:8080
      CommunityService__BaseUrl: http://community-service:8080
      CommunityService__SkipMembershipCheck: "false"
      CommunityService__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      ConnectionStrings__Postgres: Host=post-db;Port=5432;Database=${POST_POSTGRES_DB:-socialhub_posts};Username=${POST_POSTGRES_USER:-socialhub};Password=${POST_POSTGRES_PASSWORD:-local_post_password}
      Minio__Endpoint: http://post-object-storage:9000
      Minio__AccessKey: ${POST_MINIO_ROOT_USER:-local_minio_user}
      Minio__SecretKey: ${POST_MINIO_ROOT_PASSWORD:-local_minio_password}
      Minio__BucketName: ${POST_MINIO_BUCKET:-post-contents}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
    depends_on:
      post-db:
        condition: service_healthy
      post-object-storage:
        condition: service_healthy
    ports:
      - "5006:8080"
    networks:
      - socialhub-network

networks:
  socialhub-network:
    name: socialhub-network
    driver: bridge

volumes:
  auth_postgres_data:
  community_postgres_data:
  moderation_postgres_data:
  post_postgres_data:
  post_minio_data:
  message_mongo_data:
  notification_mongo_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  tempo_data:
