global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: socialhub-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8080
          - community-service:8080
          - feed-service:8080
          - message-service:8080
          - moderation-service:8080
          - notification-service:8080
          - post-service:8080
          - frontend:8080
