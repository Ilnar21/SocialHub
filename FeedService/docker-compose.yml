name: socialhub-feed

services:

  feedservice:
    image: socialhub-feedservice
    build:
      context: .
      dockerfile: src/SocialHub.Feed.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Cache__ConnectionString: redis:6379
      Cache__TtlSeconds: "300"
      Cache__KeyPrefix: feed
      # При запуске вместе с остальными микросервисами поправь имена хостов
      # на реальные DNS-имена в docker-сети SocialHub.
      Services__CommunityServiceUrl: http://community-service:8080
      Services__CommunityGrpcUrl: http://community-service:8081
      Services__PostServiceUrl: http://post-service:8080
      Services__TimeoutSeconds: "4"
      Services__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      DevAuth__EnableHeaderFallback: ${DEV_AUTH_ENABLE_HEADER_FALLBACK:-false}
    ports:
      - "5100:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - socialhub
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - socialhub

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - feedservice
    networks:
      - socialhub

networks:
  socialhub:
    driver: bridge
