worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format gateway '$remote_addr - "$request" $status '
                      '$body_bytes_sent rt=$request_time '
                      'cid="$http_x_correlation_id" uid="$http_x_user_id"';
    access_log /var/log/nginx/access.log gateway;

    sendfile on;
    keepalive_timeout 65;

    upstream feed_upstream {
        server feedservice:8080;
    }

    server {
        listen 80;
        server_name _;

        # Внутренний endpoint /feed/invalidate должен быть недоступен снаружи —
        # к нему обращаются только другие микросервисы внутри docker-сети.
        location = /feed/invalidate {
            deny all;
            return 403;
        }

        location /feed {
            proxy_pass         http://feed_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Заголовки авторизации/трассировки прокидываются как есть.
            # В реальной системе X-User-Id ставит Auth-слой шлюза после валидации токена.
            proxy_set_header   X-User-Id         $http_x_user_id;
            proxy_set_header   X-Correlation-Id  $http_x_correlation_id;

            # NFR-2: лента ≤ 5 секунд.
            proxy_connect_timeout 2s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;
        }
    }
}
