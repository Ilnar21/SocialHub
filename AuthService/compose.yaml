services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    image: socialhub-auth-service
    build:
      context: .
      dockerfile: src/SocialHub.Auth.Api/Dockerfile
    environment:
      ConnectionStrings__AuthDb: Host=auth-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      ExternalServices__NotificationBaseUrl: ${NOTIFICATION_BASE_URL}
      ExternalServices__InternalToken: ${INTERNAL_SERVICE_TOKEN}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN}
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    depends_on:
      auth-db:
        condition: service_healthy

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${AUTH_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service

volumes:
  auth-db-data:
