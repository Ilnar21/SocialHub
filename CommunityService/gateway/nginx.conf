events {}

http {
  server {
    listen 80;

    location /community/ {
      proxy_pass http://community-service:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI uses absolute /swagger and /api paths, so the stub forwards them too.
    location /swagger/ {
      proxy_pass http://community-service:8080/swagger/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://community-service:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      return 200 "gateway ok\n";
    }
  }
}
