services:
  notification-db:
    image: mongo:7
    container_name: socialhub-notification-db
    ports:
      - "27019:27017"
    volumes:
      - notification_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: src/SocialHub.Notification.Api/Dockerfile
    container_name: socialhub-notification-service
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: mongodb://notification-db:27017
      Mongo__DatabaseName: socialhub_notifications
      Mongo__NotificationsCollection: notifications
      Mongo__EventsCollection: notification_events
      NotificationProcessing__PollingIntervalSeconds: "2"
      NotificationProcessing__MaxAttempts: "5"
      Smtp__Enabled: "${SMTP_ENABLED:-false}"
      Smtp__Host: "${SMTP_HOST:-smtp.gmail.com}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseStartTls: "${SMTP_USE_START_TLS:-true}"
      Smtp__UserName: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-SocialHub}"
      Jwt__Issuer: "${JWT_ISSUER:-SocialHub.AuthService}"
      Jwt__Audience: "${JWT_AUDIENCE:-SocialHub.Client}"
      Jwt__Secret: "${JWT_SECRET:-development-secret-key-for-socialhub-integration}"
      DevAuth__EnableHeaderFallback: "${DEV_AUTH_ENABLE_HEADER_FALLBACK:-false}"
      InternalAuth__RequireInternalToken: "${INTERNAL_AUTH_REQUIRE_TOKEN:-true}"
      InternalAuth__Token: "${INTERNAL_SERVICE_TOKEN:-development-internal-service-token}"
    ports:
      - "5004:8080"

  gateway:
    image: nginx:1.27-alpine
    container_name: socialhub-notification-gateway-stub
    depends_on:
      - notification-service
    ports:
      - "8084:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  notification_mongo_data:
