services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - post-service

  post-service:
    image: socialhub-post-service
    build:
      context: .
      dockerfile: src/SocialHub.Post.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      CommunityService__BaseUrl: ${COMMUNITY_SERVICE_BASE_URL:-http://community-service:8080}
      CommunityService__GrpcUrl: ${COMMUNITY_SERVICE_GRPC_URL:-http://community-service:8081}
      CommunityService__SkipMembershipCheck: ${COMMUNITY_SERVICE_SKIP_MEMBERSHIP_CHECK:-true}
      CommunityService__InternalToken: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
      ConnectionStrings__Postgres: Host=${POSTGRES_HOST};Port=${POSTGRES_CONTAINER_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Minio__Endpoint: http://${MINIO_HOST:-minio}:${MINIO_API_PORT:-9000}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__BucketName: ${MINIO_BUCKET}
      Jwt__Issuer: ${JWT_ISSUER:-SocialHub.AuthService}
      Jwt__Audience: ${JWT_AUDIENCE:-SocialHub.Client}
      Jwt__Secret: ${JWT_SECRET:-local-dev-jwt-secret-change-me-please-32-bytes}
      InternalAuth__RequireInternalToken: ${INTERNAL_AUTH_REQUIRE_TOKEN:-true}
      InternalAuth__Token: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-change-me}
    ports:
      - "${POST_SERVICE_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - post-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - post-minio-data:/data

volumes:
  post-postgres-data:
  post-minio-data:
