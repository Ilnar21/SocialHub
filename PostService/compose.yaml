services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - post-service

  post-service:
    image: socialhub-post-service
    build:
      context: .
      dockerfile: src/SocialHub.Post.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      CommunityService__BaseUrl: http://community-service:8080
      CommunityService__SkipMembershipCheck: "true"
      CommunityService__InternalToken: ${INTERNAL_SERVICE_TOKEN:-development-internal-service-token}
    ports:
      - "8082:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialhub_posts
      POSTGRES_USER: socialhub
      POSTGRES_PASSWORD: socialhub
    ports:
      - "5434:5432"
    volumes:
      - post-postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - post-mongo-data:/data/db

volumes:
  post-postgres-data:
  post-mongo-data:
