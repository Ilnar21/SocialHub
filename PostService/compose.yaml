services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - post-service

  post-service:
    image: socialhub-post-service
    build:
      context: .
      dockerfile: src/SocialHub.Post.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      CommunityService__BaseUrl: ${COMMUNITY_SERVICE_BASE_URL:-http://community-service:8080}
      CommunityService__SkipMembershipCheck: ${COMMUNITY_SERVICE_SKIP_MEMBERSHIP_CHECK:-true}
      CommunityService__InternalToken: ${INTERNAL_SERVICE_TOKEN:-development-internal-service-token}
      ConnectionStrings__Postgres: Host=${POSTGRES_HOST};Port=${POSTGRES_CONTAINER_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Mongo__ConnectionString: mongodb://${MONGO_HOST:-mongo}:${MONGO_CONTAINER_PORT:-27017}
      Mongo__DatabaseName: ${MONGO_DATABASE:-socialhub_posts}
      Mongo__PostContentsCollectionName: ${MONGO_POST_CONTENTS_COLLECTION:-post_contents}
    ports:
      - "${POST_SERVICE_PORT:-8082}:8080"
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - post-postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - post-mongo-data:/data/db

volumes:
  post-postgres-data:
  post-mongo-data:
