events {}

http {
  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
  }

  log_format socialhub escape=json
    '{'
      '"timestamp":"$time_iso8601",'
      '"level":"Information",'
      '"service":"gateway",'
      '"correlationId":"$correlation_id",'
      '"remoteAddr":"$remote_addr",'
      '"method":"$request_method",'
      '"path":"$uri",'
      '"statusCode":$status,'
      '"elapsedSeconds":$request_time,'
      '"upstreamAddr":"$upstream_addr",'
      '"upstreamStatus":"$upstream_status",'
      '"upstreamElapsedSeconds":"$upstream_response_time"'
    '}';

  upstream auth_service {
    server auth-service:8080;
  }

  upstream frontend {
    server frontend:8080;
  }

  upstream community_service {
    server community-service:8080;
  }

  upstream feed_service {
    server feed-service:8080;
  }

  upstream message_service {
    server message-service:8080;
  }

  upstream moderation_service {
    server moderation-service:8080;
  }

  upstream notification_service {
    server notification-service:8080;
  }

  upstream post_service {
    server post-service:8080;
  }

  server {
    listen 80;

    access_log /var/log/nginx/access.log socialhub;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Correlation-Id" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Expose-Headers "X-Correlation-Id" always;
    add_header X-Correlation-Id $correlation_id always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-Id $correlation_id;
    proxy_hide_header X-Correlation-Id;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"socialhub-gateway"}';
    }

    location = /nginx_status {
      stub_status;
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
    }

    location /api/auth/ {
      proxy_pass http://auth_service/api/auth/;
    }

    location /api/users/ {
      proxy_pass http://auth_service/api/users/;
    }

    location ~ ^/api/users/([^/]+)/blocks$ {
      proxy_pass http://moderation_service$request_uri;
    }

    location ~ ^/api/communities/([^/]+)/blocks$ {
      proxy_pass http://moderation_service$request_uri;
    }

    location /api/communities/ {
      proxy_pass http://community_service/api/communities/;
    }

    location = /api/communities {
      proxy_pass http://community_service/api/communities;
    }

    location /api/notifications/ {
      proxy_pass http://notification_service/api/notifications/;
    }

    location = /api/notifications {
      proxy_pass http://notification_service/api/notifications;
    }

    location /api/notification-events/ {
      proxy_pass http://notification_service/api/notification-events/;
    }

    location = /api/notification-events {
      proxy_pass http://notification_service/api/notification-events;
    }

    location /api/posts/ {
      proxy_pass http://post_service/api/posts/;
    }

    location /api/dialogs/ {
      proxy_pass http://message_service/api/dialogs/;
    }

    location = /api/dialogs {
      proxy_pass http://message_service/api/dialogs;
    }

    location /api/reports/ {
      proxy_pass http://moderation_service/api/reports/;
    }

    location = /api/reports {
      proxy_pass http://moderation_service/api/reports;
    }

    location /api/audit/ {
      proxy_pass http://moderation_service/api/audit/;
    }

    location = /api/audit {
      proxy_pass http://moderation_service/api/audit;
    }

    location /api/private-messages/ {
      proxy_pass http://moderation_service/api/private-messages/;
    }

    location /feed {
      proxy_pass http://feed_service/feed;
    }

    location /posts {
      proxy_pass http://post_service/posts;
    }

    location /communities/ {
      proxy_pass http://post_service/communities/;
    }

    location / {
      proxy_pass http://frontend;
    }
  }
}
